services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: 4sup
      POSTGRES_USER: 4sup
      POSTGRES_PASSWORD: 4sup-test-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 4sup -d 4sup"]
      interval: 2s
      timeout: 5s
      retries: 15

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: 4sup-test
      MINIO_ROOT_PASSWORD: 4sup-test-password
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 4sup-test 4sup-test-password &&
      mc mb --ignore-existing local/4sup-test"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./tests/fixtures/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tests/fixtures/http:/usr/share/nginx/html:ro

  ftp-tls-init:
    image: postgres:16
    entrypoint:
      - /bin/sh
      - -c
      - >-
        set -eu;
        umask 077;
        openssl req -x509 -newkey "rsa:$${FTP_TLS_RSA_KEY_BITS}" -sha256 -nodes
        -days "$${FTP_TLS_CERTIFICATE_VALIDITY_DAYS}"
        -subj "/CN=$${FTP_TLS_CERTIFICATE_COMMON_NAME}"
        -addext "subjectAltName=IP:$${FTP_TLS_CERTIFICATE_COMMON_NAME}"
        -keyout /tls/server.key -out /tls/server.crt
    environment:
      FTP_TLS_RSA_KEY_BITS: 2048
      FTP_TLS_CERTIFICATE_VALIDITY_DAYS: 2
      FTP_TLS_CERTIFICATE_COMMON_NAME: 127.0.0.1
    volumes:
      - ftp-tls:/tls

  vsftpd:
    image: fauria/vsftpd@sha256:6d71d7c7f1b0ab2844ec7dc7999a30aef6d758b6d8179cf5967513f87c79c177
    entrypoint:
      - /bin/bash
      - -c
      - >-
        mkdir -p /home/vsftpd/4sup-test &&
        cp -a /seed/. /home/vsftpd/4sup-test/ &&
        cat /fixture-config/vsftpd-tls.conf >> /etc/vsftpd/vsftpd.conf &&
        exec /usr/sbin/run-vsftpd.sh
    depends_on:
      ftp-tls-init:
        condition: service_completed_successfully
    environment:
      FTP_USER: 4sup-test
      FTP_PASS: 4sup-test-password
      PASV_ADDRESS: 127.0.0.1
      PASV_MIN_PORT: 21100
      PASV_MAX_PORT: 21110
      REVERSE_LOOKUP_ENABLE: "NO"
    ports:
      - "${FOURSUP_FTP_PORT:-22121}:21"
      - "21100-21110:21100-21110"
    volumes:
      - ftp-data:/home/vsftpd
      - ftp-tls:/tls:ro
      - ./tests/fixtures/ftp-user:/seed:ro
      - ./tests/fixtures/vsftpd-tls.conf:/fixture-config/vsftpd-tls.conf:ro

volumes:
  minio-data:
  ftp-data:
  ftp-tls:
