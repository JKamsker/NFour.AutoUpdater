name: 4sup CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start MinIO
        run: docker compose up -d minio minio-init
      - name: Restore
        run: dotnet restore AutoUpdater.sln
      - name: Build
        run: dotnet build AutoUpdater.sln --no-restore --configuration Release
      - name: Test (all backends enabled)
        run: FOURSUP_MINIO=1 dotnet test AutoUpdater.sln --no-build --no-restore --configuration Release
      - name: Secret scan
        run: bash scripts/secret-scan.sh
      - name: Diff hygiene
        run: git diff --check
