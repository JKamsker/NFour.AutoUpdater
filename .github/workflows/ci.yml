name: 4sup CI

on:
  push:
  pull_request:

# Release configuration refuses to build with the development trust root compiled in
# (FS4SUP001). CI is not producing a shippable client, so it acknowledges that explicitly.
env:
  DOTNET_BUILD_ARGS: "-p:FourSaasAllowDevelopmentTrustRoot=true"

jobs:
  # Exercise both Darwin ABIs explicitly. macos-15-intel is x64; macos-15 is arm64.
  # macos-latest alone currently covers arm64 and would leave the $INODE64 path unexecuted.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AutoUpdater.sln
      - name: Build
        run: dotnet build AutoUpdater.sln --no-restore --configuration Release $DOTNET_BUILD_ARGS
        shell: bash
      - name: Test
        run: dotnet test AutoUpdater.sln --no-build --no-restore --configuration Release
        shell: bash

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Start integration services
        run: docker compose up -d postgres minio minio-init nginx vsftpd
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U 4sup -d 4sup; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Restore
        run: dotnet restore AutoUpdater.sln
      - name: Build
        run: dotnet build AutoUpdater.sln --no-restore --configuration Release $DOTNET_BUILD_ARGS
      - name: Configure storage test clients
        run: |
          ftp_control_port=21
          ftp_endpoint="$(docker compose port vsftpd "$ftp_control_port")"
          ftp_published_port="${ftp_endpoint##*:}"
          ftp_user="$(docker compose exec -T vsftpd printenv FTP_USER | tr -d '\r')"
          ftp_password="$(docker compose exec -T vsftpd printenv FTP_PASS | tr -d '\r')"
          printf '::add-mask::%s\n' "$ftp_user" "$ftp_password"
          printf 'FOURSUP_FTP_URI=ftp://127.0.0.1:%s/\n' "$ftp_published_port" >> "$GITHUB_ENV"
          printf 'FOURSUP_FTP_USER=%s\n' "$ftp_user" >> "$GITHUB_ENV"
          printf 'FOURSUP_FTP_PASSWORD=%s\n' "$ftp_password" >> "$GITHUB_ENV"
          minio_api_port=9000
          minio_endpoint="$(docker compose port minio "$minio_api_port")"
          minio_published_port="${minio_endpoint##*:}"
          minio_access_key="$(docker compose exec -T minio printenv MINIO_ROOT_USER | tr -d '\r')"
          minio_secret_key="$(docker compose exec -T minio printenv MINIO_ROOT_PASSWORD | tr -d '\r')"
          printf '::add-mask::%s\n' "$minio_access_key" "$minio_secret_key"
          printf 'FOURSUP_MINIO_URI=http://127.0.0.1:%s\n' "$minio_published_port" >> "$GITHUB_ENV"
          printf 'FOURSUP_MINIO_ACCESS_KEY=%s\n' "$minio_access_key" >> "$GITHUB_ENV"
          printf 'FOURSUP_MINIO_SECRET_KEY=%s\n' "$minio_secret_key" >> "$GITHUB_ENV"
          nginx_http_port=80
          nginx_endpoint="$(docker compose port nginx "$nginx_http_port")"
          nginx_published_port="${nginx_endpoint##*:}"
          printf 'FOURSUP_HTTP_URI=http://127.0.0.1:%s/\n' "$nginx_published_port" >> "$GITHUB_ENV"
          postgres_database_port=5432
          postgres_endpoint="$(docker compose port postgres "$postgres_database_port")"
          postgres_published_port="${postgres_endpoint##*:}"
          postgres_database="$(docker compose exec -T postgres printenv POSTGRES_DB | tr -d '\r')"
          postgres_user="$(docker compose exec -T postgres printenv POSTGRES_USER | tr -d '\r')"
          postgres_password="$(docker compose exec -T postgres printenv POSTGRES_PASSWORD | tr -d '\r')"
          printf '::add-mask::%s\n' "$postgres_database" "$postgres_user" "$postgres_password"
          printf 'FOURSUP_DATABASE=Host=127.0.0.1;Port=%s;Database=%s;Username=%s;Password=%s\n' "$postgres_published_port" "$postgres_database" "$postgres_user" "$postgres_password" >> "$GITHUB_ENV"
      - name: Test (all backends enabled)
        env:
          FOURSUP_MINIO: 1
          FOURSUP_HTTP: 1
          FOURSUP_FTP: 1
          FOURSUP_POSTGRES: 1
        run: dotnet test AutoUpdater.sln --no-build --no-restore --configuration Release

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AutoUpdater.sln
      - name: Dependency vulnerability audit
        run: |
          dotnet list AutoUpdater.sln package --include-transitive --vulnerable --format json > vulnerable.json
          cat vulnerable.json
          if grep -q '"severity"' vulnerable.json; then
            echo "Vulnerable packages reported above."
            exit 1
          fi
      - name: Deprecated package report
        run: dotnet list AutoUpdater.sln package --include-transitive --deprecated
      - name: Secret scan
        run: bash scripts/secret-scan.sh
      - name: Diff hygiene
        run: git diff --check
      - name: C# file-size policy
        run: scripts/check-file-size.sh

  # Prove both sides of the release guard: development roots fail unless explicitly
  # acknowledged, while a supplied production-shaped root builds successfully.
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: A Release build carrying the development trust root must fail
        run: |
          if dotnet build src/FourSaas.AutoUpdater.Core -c Release -t:Rebuild > guard.log 2>&1; then
            echo "Release build succeeded with the development trust root; FS4SUP001 is not enforcing."
            cat guard.log
            exit 1
          fi
          grep -q FS4SUP001 guard.log || { echo "Build failed for an unrelated reason:"; cat guard.log; exit 1; }
      - name: A Release build with a supplied root must succeed
        run: dotnet build src/FourSaas.AutoUpdater.Core -c Release -t:Rebuild -p:FourSaasTrustRootKeyId=ci-root -p:FourSaasTrustRootPublicKey=Zm9vYmFyYmF6cXV4MDEyMzQ1Njc4OWFiY2RlZmdoaWo
